<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Operations Platform for Customer Experience & Revenue</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=2026.18" />
  <link rel="stylesheet" href="premium.css?v=2026.25" />
  <link rel="stylesheet" href="ops.css?v=2026.31" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" defer></script>
</head>
<body data-theme="light">
  <div class="opsApp">
    <aside class="opsSidebar">
      <div class="opsBrand">
        <div class="opsLogo"><i class="fa-solid fa-layer-group"></i></div>
        <div>
          <div class="opsBrandTitle">AI Operations Platform</div>
          <div class="opsBrandSub">Customer Experience & Revenue</div>
        </div>
      </div>

      <div class="opsNavGroup">
        <div class="opsNavLabel">AI Operations</div>
        <button class="opsNavItem" data-route="live-ai"><i class="fa-solid fa-signal"></i> Live AI</button>
        <button class="opsNavItem" data-route="conversations"><i class="fa-solid fa-messages"></i> Conversations</button>
        <button class="opsNavItem" data-route="ai-agents"><i class="fa-solid fa-robot"></i> AI Agents</button>
      </div>

      <div class="opsNavGroup">
        <div class="opsNavLabel">Performance</div>
        <button class="opsNavItem" data-route="overview"><i class="fa-solid fa-gauge-high"></i> Overview</button>
        <button class="opsNavItem" data-route="support-performance"><i class="fa-solid fa-headset"></i> Support Performance</button>
        <button class="opsNavItem" data-route="sales-performance"><i class="fa-solid fa-chart-line"></i> Sales Performance</button>
      </div>

      <div class="opsNavGroup">
        <div class="opsNavLabel">Optimization</div>
        <button class="opsNavItem" data-route="opportunities"><i class="fa-solid fa-bullseye"></i> Opportunities</button>
        <button class="opsNavItem" data-route="experiments"><i class="fa-solid fa-flask"></i> Experiments</button>
        <button class="opsNavItem" data-route="automation-rules"><i class="fa-solid fa-diagram-project"></i> Automation</button>
      </div>

      <div class="opsNavGroup">
        <div class="opsNavLabel">Business</div>
        <button class="opsNavItem" data-route="forecasting"><i class="fa-solid fa-chart-area"></i> Forecasting</button>
        <button class="opsNavItem" data-route="roi"><i class="fa-solid fa-coins"></i> ROI & Impact</button>
      </div>

      <div class="opsNavGroup">
        <div class="opsNavLabel">System</div>
        <button class="opsNavItem" data-route="ai-configuration"><i class="fa-solid fa-sliders"></i> AI Configuration</button>
        <button class="opsNavItem" data-route="integrations"><i class="fa-solid fa-plug"></i> Integrations</button>
        <button class="opsNavItem" data-route="security"><i class="fa-solid fa-shield"></i> Security & Compliance</button>
      </div>

      <div class="opsNavGroup">
        <div class="opsNavLabel">AI Control Center</div>
        <button class="opsNavItem" data-route="ai-control-center"><i class="fa-solid fa-microchip"></i> Open Control Center</button>
      </div>

      <div class="opsSidebarFooter">
        <button id="opsThemeToggle" class="btn ghost full" type="button">
          <i class="fa-solid fa-moon"></i> Theme
        </button>
        <a class="btn ghost full" href="/" style="text-decoration:none; display:flex; align-items:center; gap:10px; justify-content:center;">
          <i class="fa-solid fa-arrow-left"></i> Back to App
        </a>
      </div>
    </aside>

    <main class="opsMain">
      <div class="topbar">
        <div class="opsTopbarLeft">
          <div class="opsCompany">
            <div class="title" id="opsCompanyName" style="font-size:18px;">Company</div>
            <div class="muted small" id="opsEnvBadge">Environment</div>
          </div>
          <select id="opsCompanySelect" class="input" style="min-width:240px;"></select>
        </div>
        <div class="topbarActions">
          <button id="opsNotifBtn" class="btn ghost round icon" type="button" title="Notifications">
            <i class="fa-solid fa-bell"></i>
          </button>
          <button id="opsUserBtn" class="btn ghost" type="button">
            <i class="fa-solid fa-user"></i> <span id="opsUserName">User</span>
          </button>
        </div>
      </div>

      <div id="opsNotifPanel" class="opsPopover panel soft" style="display:none;"></div>
      <div id="opsUserPanel" class="opsPopover panel soft" style="display:none;"></div>

      <section class="opsPage" id="opsPageMain">
        <div class="opsHeader">
          <div>
            <div class="title" id="opsPageTitle" style="font-size: clamp(22px, 2vw, 30px);">Overview</div>
            <div class="subtitle" id="opsPageSub">Customer operations.</div>
          </div>
          <div id="opsPrimaryCta"></div>
        </div>

        <div id="opsKpiStrip" class="grid4" style="margin-top: 14px; gap: 14px;"></div>

        <div class="panel soft" style="margin-top: 14px;">
          <div class="panelHead">
            <div><b>AI Insights</b></div>
          </div>
          <div id="opsInsightsGrid" class="grid2" style="padding: 14px;"></div>
        </div>

        <div id="opsContent" style="display: grid; grid-template-columns: 1fr 380px; gap: 14px; margin-top: 14px;"></div>
      </section>

      <!-- AI CONTROL CENTER (Standalone Panel inside Ops Platform) -->
      <section id="aiOsView" class="opsPage" style="display:none; max-width:none; margin:0; padding:0; height:calc(100vh - 74px); overflow:hidden;">
        <div style="display:flex; height:100%;">
          <aside style="width:260px; background:var(--panel2); border-right:1px solid var(--border); display:flex; flex-direction:column; padding-top:20px;">
            <div style="padding:0 20px 20px 20px; font-weight:900; font-size:16px; border-bottom:1px solid var(--border); margin-bottom:12px;">
              <i class="fa-solid fa-microchip" style="color:var(--primary); margin-right:8px;"></i> AI Control Center
            </div>
            <div id="aiOsNav" style="display:flex; flex-direction:column; gap:4px; padding:0 12px; overflow-y:auto;">
              <button class="menuBtn active" data-aios="live-studio"><i class="fa-solid fa-play-circle"></i> Live Studio</button>
              <button class="menuBtn" data-aios="conversations"><i class="fa-solid fa-pen-to-square"></i> Conversations</button>
              <button class="menuBtn" data-aios="behavior"><i class="fa-solid fa-brain"></i> Behavior</button>
              <button class="menuBtn" data-aios="flows"><i class="fa-solid fa-diagram-project"></i> Flows</button>
              <button class="menuBtn" data-aios="knowledge"><i class="fa-solid fa-book-bookmark"></i> Knowledge</button>
              <button class="menuBtn" data-aios="training"><i class="fa-solid fa-crosshairs"></i> Training</button>
              <button class="menuBtn" data-aios="performance"><i class="fa-solid fa-chart-pie"></i> Performance</button>
              <button class="menuBtn" data-aios="experiments"><i class="fa-solid fa-flask"></i> Experiments</button>
              <button class="menuBtn" data-aios="automations"><i class="fa-solid fa-bolt"></i> Automations</button>
              <button class="menuBtn" data-aios="logs"><i class="fa-solid fa-clipboard-list"></i> Logs</button>
            </div>
          </aside>
          <div style="flex:1; display:flex; flex-direction:column; background:var(--bg);">
            <div style="height:70px; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 30px; justify-content:space-between; background:var(--panel);">
              <div>
                <div id="aiOsHeaderTitle" class="title" style="font-size:20px; font-weight:800;">Live Studio</div>
                <div id="aiOsHeaderSub" class="muted small" style="margin-top:4px;">Test AI in real-time and understand behavior.</div>
              </div>
              <div id="aiOsHeaderActions"></div>
            </div>
            <div id="aiOsContent" style="flex:1; overflow:auto; padding:30px;">
              <!-- Dynamic module content -->
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="ops.js?v=2026.32"></script>
  <script src="ai_os.js?v=2026.55"></script>
</body>
</html>
